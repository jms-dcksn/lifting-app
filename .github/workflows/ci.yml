name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same entry point runs locally and refreshes stale route types first.
      - run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

  database:
    name: Database RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the Supabase CLI version pinned in package.json, so CI and
      # `npm run test:db` run the same binary against the same test files.
      - run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Run pgTAP ownership tests
        run: npm run test:db

      - name: Verify untouched built-in program compatibility
        run: npm run test:db:compatibility
        env:
          COACH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify competing Coach transactions
        run: npm run test:db:concurrency
        env:
          COACH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Install browser for smoke verification
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated phone journeys
        id: browser
        run: node scripts/browser-local.mjs
        env:
          COACH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Record browser verification evidence
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome || 'not run' }}
        run: |
          {
            echo "### Browser verification"
            echo "PR head: $PR_HEAD"
            echo "Tested checkout: $(git rev-parse HEAD)"
            echo "Authenticated phone journeys: $BROWSER_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
