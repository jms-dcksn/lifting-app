# Reviews a same-repo pull request when it opens or receives new commits.
# A newer push cancels the in-flight job. Requires CURSOR_API_KEY. See DEPLOY.md.
name: Security review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Cursor security review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.body || '', 'security-review-follow-up') &&
      !(startsWith(github.event.pull_request.head.ref, 'cursor/') && startsWith(github.event.pull_request.title, 'Security review for #'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=Missing CURSOR_API_KEY::Add the repository Actions secret named CURSOR_API_KEY. See DEPLOY.md."
            exit 1
          fi

      # Run the pinned runner from the pull request base, not the head. The head
      # branch could modify review.ts and exfiltrate CURSOR_API_KEY.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/security-review/package-lock.json

      - name: Install security review runner
        working-directory: .github/security-review
        run: npm ci

      - name: Typecheck runner
        working-directory: .github/security-review
        run: npx tsc --noEmit

      - name: Run cloud security review
        working-directory: .github/security-review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO_URL: https://github.com/${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: npx tsx review.ts
